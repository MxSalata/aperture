name: CI

on:
  push:
    # Feature branches too, so the IRIS job checks the package before it reaches main; and version
    # tags, which publish that version's image.
    branches: [main, master, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege by default; the Pages deployment job raises what it needs.
permissions:
  contents: read

# One queue per branch, and a superseded push cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Python vectoriser tests (the package's twin of src/lib/logVectors.ts, no IRIS needed)
        run: python3 -m unittest discover -s ipm/python/tests -p 'test_*.py'
      - run: npm run build
      - name: Entry chunk stays small and free of the spec index
        run: npm run check:bundle
      - name: www/ is current (the IPM package ships the committed build)
        env:
          COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          npm run build:www
          if [ -z "$(git status --porcelain -- www)" ]; then exit 0; fi
          # A dependency update changes the bundle. On Dependabot's pull request the build is checked
          # and the comparison skipped; on the push that merges it into main, the job below commits
          # the rebuilt www/. Everyone else commits www/ with the change, as before.
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            echo "www/ changes with this dependency update; it is rebuilt and committed when the pull request is merged"
            exit 0
          fi
          if [ "${{ github.ref }}" = "refs/heads/main" ] && printf '%s' "$COMMITS" | jq -e 'map(.author.username) | index("dependabot[bot]")' > /dev/null; then
            echo "www/ changes with the merged dependency update; the www-after-dependabot-merge job commits it to main"
            exit 0
          fi
          echo "www/ is stale: run 'npm run build:www' and commit the result"; git status --porcelain -- www; exit 1
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - name: Build the online demo (in-browser mock, hash router)
        run: npm run build:demo
      # Every run keeps the demo build as a plain artifact (download, unzip, serve with any static
      # server). The Pages artifact and the deployment below are opt-in through the repository
      # variable DEPLOY_DEMO, because GitHub Pages is not available while the repository is private.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-site
          path: dist-demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: vars.DEPLOY_DEMO == 'true' && github.ref == 'refs/heads/main'
        with:
          path: dist-demo

  # A merged Dependabot pull request changes the bundle but not the committed www/, which the IPM
  # package and the image ship. On that push to main, and on no other event, this job makes the
  # update a patch release: when the merge changed package.json, the last figure of the version
  # moves (npm version patch; module.xml follows), the CHANGELOG gets a section naming the packages
  # (scripts/dependency-release.mjs), www/ is rebuilt after the bump so the About page shows the
  # new version, and the commit is pushed to main with its annotated tag and a GitHub release;
  # verify-iris then builds the image from that commit and publishes latest, main-<sha> and the
  # version. A merge that changed only workflows or a Dockerfile rebuilds nothing and bumps nothing.
  # Only a maintainer's merge starts this job, so no run that Dependabot starts holds a write token.
  # A push made with GITHUB_TOKEN starts no workflow, so the commit is checked by the next push.
  www-after-dependabot-merge:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(toJson(github.event.commits.*.author.username), 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make the dependency update a patch release, with www/ rebuilt
        id: commit
        env:
          COMMITS: ${{ toJson(github.event.commits) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bump=$(printf '%s' "$COMMITS" | jq -r '[.[] | (.added + .modified)[]] | index("package.json") != null')
          version=""
          if [ "$bump" = "true" ]; then
            version=$(npm version patch --no-git-tag-version)
            version=${version#v}
            sed -i "s|<Version>[^<]*</Version>|<Version>$version</Version>|" module.xml
            printf '%s' "$COMMITS" | node scripts/dependency-release.mjs "$version" > release-notes.md
          fi
          npm run build:www
          if [ -z "$version" ] && [ -z "$(git status --porcelain -- www)" ]; then
            echo "package.json unchanged and www/ current: nothing to commit"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A www
          if [ -n "$version" ]; then
            git add package.json package-lock.json module.xml CHANGELOG.md
            git commit -m "$version: dependency updates" -F - < release-notes.md
            git tag -a "v$version" -m "Aperture $version: dependency updates"
            git push origin HEAD:main "v$version"
            gh release create "v$version" --title "Aperture $version" --notes-file release-notes.md
            echo "Released $version from the dependency update"
          else
            git commit -m "www/ rebuilt for the dependency update"
            git push origin HEAD:main
            echo "Committed the rebuilt www/ to main"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Builds the IRIS image (official IRIS Community 2026.2 image plus the package manager),
  # which installs Aperture through its own module.xml (zpm "load") and runs the Embedded
  # Python installer at build time; then starts it and checks the SysAdmin API behaves as
  # Aperture assumes (JWT, shapes, 202 flow, portal served), with a password set at start and
  # with the image's own. The image that passed is then published to the GitHub Container
  # Registry: latest and the version from main, the version from a tag, edge from a feature branch.
  verify-iris:
    needs: [verify, www-after-dependabot-merge]
    # Runs after verify whether or not the rebuild job had anything to do (it is skipped on every
    # event but a dependency merge).
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.www-after-dependabot-merge.result == 'success' || needs.www-after-dependabot-merge.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_FILE: docker-compose.build.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the rebuild job made, when it made one; the pushed commit otherwise.
          ref: ${{ needs.www-after-dependabot-merge.outputs.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The container gets a password of its own at start (IRIS_PASSWORD), as users are told to
      # do; the image's demonstration password is checked separately below.
      - name: Choose the administrator password for this run
        run: |
          pw=$(openssl rand -base64 18 | tr '+/' '-_')
          echo "::add-mask::$pw"
          echo "IRIS_PASSWORD=$pw" >> "$GITHUB_ENV"
      - name: Build the IRIS image (zpm "load" of the package, Embedded Python installer)
        run: docker compose --progress plain build iris
      - name: Start IRIS
        run: docker compose up -d --no-build iris
      - name: Wait for the SysAdmin API
        run: |
          code=
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "_SYSTEM:$IRIS_PASSWORD" http://localhost:52773/api/admin/info || true)
            if [ "$code" = "200" ]; then echo "API up after $((i*5))s"; exit 0; fi
            sleep 5
          done
          echo "SysAdmin API did not come up (last HTTP status: '$code')"
          docker compose ps -a
          docker inspect --format 'state={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' aperture-iris || true
          docker logs aperture-iris 2>&1 | tail -150 || true
          exit 1
      - name: Live conformance check
        run: node scripts/live-check.mjs --save docs/verification/ci-latest.json --mutate
        env:
          IRIS_URL: http://localhost:52773
          IRIS_USER: _SYSTEM
          PORTAL_URL: http://localhost:52773/aperture/index.html
      # IRIS_PASSWORD is applied at the container's first start only (apply-password.sh), so a
      # password an administrator changes in IRIS afterwards must survive a restart.
      - name: A password changed in IRIS survives a restart
        run: |
          pw2=$(openssl rand -base64 18 | tr '+/' '-_')
          echo "::add-mask::$pw2"
          docker exec -i -e NEW_PASSWORD="$pw2" aperture-iris iris session IRIS -U %SYS <<'OBJECTSCRIPT'
          Kill p  Set p("Password")=$System.Util.GetEnviron("NEW_PASSWORD"),sc=##class(Security.Users).Modify("_SYSTEM",.p)  If 'sc Write $system.Status.GetErrorText(sc),!  Do $system.Process.Terminate($job,1)
          Halt
          OBJECTSCRIPT
          docker restart aperture-iris >/dev/null
          code=
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "_SYSTEM:$pw2" http://localhost:52773/api/admin/info || true)
            if [ "$code" = "200" ]; then echo "The changed password signs in after the restart ($((i*5))s)"; break; fi
            sleep 5
          done
          docker logs aperture-iris 2>&1 | grep "Aperture image" || true
          [ "$code" = "200" ] || { echo "The changed password did not sign in after the restart (last HTTP status: '$code')"; exit 1; }
          docker logs aperture-iris 2>&1 | grep -q "applied at the first start" || { echo "The restart did not skip IRIS_PASSWORD"; exit 1; }
      - name: Without IRIS_PASSWORD, the image signs in with its demonstration password
        run: |
          docker run -d --name aperture-default -p 127.0.0.1:52774:52773 aperture-iris:local --check-caps false --ISCAgent false
          code=
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "_SYSTEM:SYS" http://localhost:52774/api/admin/info || true)
            if [ "$code" = "200" ]; then echo "_SYSTEM/SYS signs in after $((i*5))s"; break; fi
            sleep 5
          done
          docker logs aperture-default 2>&1 | grep -i "aperture image" || true
          docker rm -f aperture-default >/dev/null
          [ "$code" = "200" ] || { echo "_SYSTEM/SYS did not sign in (last HTTP status: '$code')"; exit 1; }
      - name: Publish the checked image
        if: github.event_name == 'push'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=$(node -p "require('./package.json').version")
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          case "$GITHUB_REF" in
            refs/heads/main)
              # latest, and an immutable tag for this commit. The version's tag is set once, the
              # first time main carries a version the registry has not seen (or by a tag push), and
              # never moved: a dependency update merged after a release gives a fresh latest and
              # main-<sha> and leaves the release's image as it was.
              tags="latest main-$(git rev-parse --short=7 HEAD)"
              docker manifest inspect "$image:$version" > /dev/null 2>&1 || tags="$tags $version"
              ;;
            refs/tags/v*) tags="$version" ;;
            *) tags="edge" ;;
          esac
          for tag in $tags; do
            docker tag aperture-iris:local "$image:$tag"
            docker push "$image:$tag"
          done
          echo "Published $image with tags: $tags"
      - name: Readiness report (Embedded Python, inside the running container)
        if: always()
        run: docker exec aperture-iris iris session IRIS -U USER "##class(Aperture.Installer).Doctor()" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iris-verification
          path: docs/verification/ci-latest.json
      - name: IRIS logs
        if: always()
        run: docker logs aperture-iris 2>&1 | tail -80 || true; docker compose down -v

  # Publishes the demo to GitHub Pages. Skipped (not failed) until the repository is public,
  # Pages is enabled (Settings → Pages → Source: GitHub Actions) and the repository variable
  # DEPLOY_DEMO is set to 'true'.
  deploy-demo:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_DEMO == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Pages deployments must never be interrupted, so this job keeps its own serial queue.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
