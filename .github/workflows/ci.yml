name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the Pages deployment job raises what it needs.
permissions:
  contents: read

# One queue per branch, and a superseded push cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Entry chunk stays small and free of the spec index
        run: npm run check:bundle
      - name: www/ is current (the IPM package ships the committed build)
        run: |
          npm run build:www
          if [ -n "$(git status --porcelain -- www)" ]; then
            echo "www/ is stale: run 'npm run build:www' and commit the result"; git status --porcelain -- www; exit 1
          fi
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - name: Build the online demo (in-browser mock, hash router)
        run: npm run build:demo
      # Every run keeps the demo build as a plain artifact (download, unzip, serve with any static
      # server). The Pages artifact and the deployment below are opt-in through the repository
      # variable DEPLOY_DEMO, because GitHub Pages is not available while the repository is private.
      - uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: dist-demo
      - uses: actions/upload-pages-artifact@v3
        if: vars.DEPLOY_DEMO == 'true'
        with:
          path: dist-demo

  # Builds the IRIS image (official IRIS Community 2026.2 image plus the package manager),
  # which installs Aperture through its own module.xml (zpm "load") and runs the Embedded
  # Python installer at build time; then starts it and checks the SysAdmin API behaves as
  # Aperture assumes (JWT, shapes, 202 flow, portal served).
  verify-iris:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the IRIS image (zpm "load" of the package, Embedded Python installer)
        run: docker compose --progress plain build iris
      - name: Start IRIS
        run: docker compose up -d --no-build iris
      - name: Wait for the SysAdmin API
        run: |
          code=
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u _SYSTEM:SYS http://localhost:52773/api/admin/info || true)
            if [ "$code" = "200" ]; then echo "API up after $((i*5))s"; exit 0; fi
            sleep 5
          done
          echo "SysAdmin API did not come up (last HTTP status: '$code')"
          docker compose ps -a
          docker inspect --format 'state={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' aperture-iris || true
          docker logs aperture-iris 2>&1 | tail -150 || true
          exit 1
      - name: Live conformance check
        run: node scripts/live-check.mjs --save docs/verification/ci-latest.json --mutate
        env:
          IRIS_URL: http://localhost:52773
          IRIS_USER: _SYSTEM
          IRIS_PASSWORD: SYS
          PORTAL_URL: http://localhost:52773/aperture/index.html
      - name: Readiness report (Embedded Python, inside the running container)
        if: always()
        run: docker exec aperture-iris iris session IRIS -U USER "##class(Aperture.Installer).Doctor()" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-verification
          path: docs/verification/ci-latest.json
      - name: IRIS logs
        if: always()
        run: docker logs aperture-iris 2>&1 | tail -80 || true; docker compose down -v

  # Publishes the demo to GitHub Pages. Skipped (not failed) until the repository is public,
  # Pages is enabled (Settings → Pages → Source: GitHub Actions) and the repository variable
  # DEPLOY_DEMO is set to 'true'.
  deploy-demo:
    if: github.event_name != 'pull_request' && vars.DEPLOY_DEMO == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Pages deployments must never be interrupted, so this job keeps its own serial queue.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
