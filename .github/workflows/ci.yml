name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - name: Build online demo (GitHub Pages)
        run: npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  # Boots a real IRIS Community instance, applies the init script and checks the
  # SysAdmin API behaves as Aperture assumes (JWT, shapes, 202 flow, portal served).
  verify-iris:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start IRIS with the Aperture init script
        run: docker compose up -d iris
      - name: Wait for the SysAdmin API
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u _SYSTEM:SYS http://localhost:52773/api/admin/info || true)
            if [ "$code" = "200" ]; then echo "API up after $((i*5))s"; exit 0; fi
            sleep 5
          done
          echo "SysAdmin API did not come up"; docker compose logs iris | tail -100; exit 1
      - name: Live conformance check
        run: node scripts/live-check.mjs --save docs/verification/ci-latest.json
        env:
          IRIS_URL: http://localhost:52773
          IRIS_USER: _SYSTEM
          IRIS_PASSWORD: SYS
          PORTAL_URL: http://localhost:52773/aperture/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-verification
          path: docs/verification/ci-latest.json
      - name: IRIS logs
        if: always()
        run: docker compose logs iris | tail -60; docker compose down -v

  deploy-demo:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
