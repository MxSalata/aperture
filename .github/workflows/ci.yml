name: CI

on:
  push:
    # Feature branches too, so the IRIS job checks the package before it reaches main; and version
    # tags, which publish that version's image.
    branches: [main, master, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege by default; the Pages deployment job raises what it needs.
permissions:
  contents: read

# One queue per branch, and a superseded push cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Python vectoriser tests (the package's twin of src/lib/logVectors.ts, no IRIS needed)
        run: python3 -m unittest discover -s ipm/python/tests -p 'test_*.py'
      - run: npm run build
      - name: Entry chunk stays small and free of the spec index
        run: npm run check:bundle
      - name: www/ is current (the IPM package ships the committed build)
        run: |
          npm run build:www
          if [ -n "$(git status --porcelain -- www)" ]; then
            echo "www/ is stale: run 'npm run build:www' and commit the result"; git status --porcelain -- www; exit 1
          fi
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - name: Build the online demo (in-browser mock, hash router)
        run: npm run build:demo
      # Every run keeps the demo build as a plain artifact (download, unzip, serve with any static
      # server). The Pages artifact and the deployment below are opt-in through the repository
      # variable DEPLOY_DEMO, because GitHub Pages is not available while the repository is private.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-site
          path: dist-demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: vars.DEPLOY_DEMO == 'true' && github.ref == 'refs/heads/main'
        with:
          path: dist-demo

  # Builds the IRIS image (official IRIS Community 2026.2 image plus the package manager),
  # which installs Aperture through its own module.xml (zpm "load") and runs the Embedded
  # Python installer at build time; then starts it and checks the SysAdmin API behaves as
  # Aperture assumes (JWT, shapes, 202 flow, portal served), with a password set at start and
  # with the image's own. The image that passed is then published to the GitHub Container
  # Registry: latest and the version from main, the version from a tag, edge from a feature branch.
  verify-iris:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_FILE: docker-compose.build.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The container gets a password of its own at start (IRIS_PASSWORD), as users are told to
      # do; the image's demonstration password is checked separately below.
      - name: Choose the administrator password for this run
        run: |
          pw=$(openssl rand -base64 18 | tr '+/' '-_')
          echo "::add-mask::$pw"
          echo "IRIS_PASSWORD=$pw" >> "$GITHUB_ENV"
      - name: Build the IRIS image (zpm "load" of the package, Embedded Python installer)
        run: docker compose --progress plain build iris
      - name: Start IRIS
        run: docker compose up -d --no-build iris
      - name: Wait for the SysAdmin API
        run: |
          code=
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "_SYSTEM:$IRIS_PASSWORD" http://localhost:52773/api/admin/info || true)
            if [ "$code" = "200" ]; then echo "API up after $((i*5))s"; exit 0; fi
            sleep 5
          done
          echo "SysAdmin API did not come up (last HTTP status: '$code')"
          docker compose ps -a
          docker inspect --format 'state={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' aperture-iris || true
          docker logs aperture-iris 2>&1 | tail -150 || true
          exit 1
      - name: Live conformance check
        run: node scripts/live-check.mjs --save docs/verification/ci-latest.json --mutate
        env:
          IRIS_URL: http://localhost:52773
          IRIS_USER: _SYSTEM
          PORTAL_URL: http://localhost:52773/aperture/index.html
      - name: Without IRIS_PASSWORD, the image signs in with its demonstration password
        run: |
          docker run -d --name aperture-default -p 127.0.0.1:52774:52773 aperture-iris:local --check-caps false --ISCAgent false
          code=
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "_SYSTEM:SYS" http://localhost:52774/api/admin/info || true)
            if [ "$code" = "200" ]; then echo "_SYSTEM/SYS signs in after $((i*5))s"; break; fi
            sleep 5
          done
          docker logs aperture-default 2>&1 | grep -i "aperture image" || true
          docker rm -f aperture-default >/dev/null
          [ "$code" = "200" ] || { echo "_SYSTEM/SYS did not sign in (last HTTP status: '$code')"; exit 1; }
      - name: Publish the checked image
        if: github.event_name == 'push'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=$(node -p "require('./package.json').version")
          case "$GITHUB_REF" in
            refs/heads/main) tags="latest $version" ;;
            refs/tags/v*) tags="$version" ;;
            *) tags="edge" ;;
          esac
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in $tags; do
            docker tag aperture-iris:local "$image:$tag"
            docker push "$image:$tag"
          done
          echo "Published $image with tags: $tags"
      - name: Readiness report (Embedded Python, inside the running container)
        if: always()
        run: docker exec aperture-iris iris session IRIS -U USER "##class(Aperture.Installer).Doctor()" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iris-verification
          path: docs/verification/ci-latest.json
      - name: IRIS logs
        if: always()
        run: docker logs aperture-iris 2>&1 | tail -80 || true; docker compose down -v

  # Publishes the demo to GitHub Pages. Skipped (not failed) until the repository is public,
  # Pages is enabled (Settings → Pages → Source: GitHub Actions) and the repository variable
  # DEPLOY_DEMO is set to 'true'.
  deploy-demo:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_DEMO == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Pages deployments must never be interrupted, so this job keeps its own serial queue.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
